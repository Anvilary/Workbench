[program:tab-controller]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",CDP_HOST="127.0.0.1",CDP_PORT="9222",CONTROLLER_HOST="0.0.0.0",CONTROLLER_PORT="9223"
command=/usr/bin/python3 /etc/neko/tab_controller.py
stopsignal=TERM
stopwaitsecs=3
autorestart=true
priority=850
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/tab_controller.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true
