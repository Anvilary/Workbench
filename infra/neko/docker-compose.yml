services:
  neko:
    image: m1k1o/neko@sha256:9585af527274b594483af59fee8a97907cbde825c2865bf5e8ef6a8c4381e059
    container_name: maw-neko
    hostname: maw-neko
    restart: unless-stopped
    shm_size: "2gb"
    cap_add:
      # Enables Chromium multi-process user namespace sandboxing without privileged mode
      - SYS_ADMIN
    entrypoint: ["/entrypoint-maw.sh"]
    command: ["/usr/bin/supervisord", "-c", "/etc/neko/supervisord.conf"]
    ports:
      # Neko WebRTC UI and API - bound to localhost only
      - "127.0.0.1:8085:8080"
      # Restricted Chromium Tab Controller - bound to localhost only
      - "127.0.0.1:9223:9223"
      # WebRTC UDP ephemeral media stream range - bound to localhost only
      - "127.0.0.1:52000-52010:52000-52010/udp"
    environment:
      NEKO_SERVER_BIND: "0.0.0.0:8080"
      NEKO_DESKTOP_SCREEN: "${NEKO_DESKTOP_SCREEN:-1280x720@30}"
      NEKO_WEBRTC_NAT1TO1: "127.0.0.1"
      NEKO_WEBRTC_EPR: "52000-52010"
      NEKO_WEBRTC_ICELITE: "true"
      NEKO_MEMBER_PROVIDER: "multiuser"
      # Explicitly required strong secrets - fail closed if missing or empty
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: "${NEKO_PASSWORD:?NEKO_PASSWORD is required and must not be empty}"
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: "${NEKO_ADMIN_PASSWORD:?NEKO_ADMIN_PASSWORD is required and must not be empty}"
      CONTROLLER_AUTH_TOKEN: "${CONTROLLER_AUTH_TOKEN:?CONTROLLER_AUTH_TOKEN is required and must not be empty}"
      PERMITTED_ORIGINS: "${PERMITTED_ORIGINS:-}"
      CDP_HOST: "127.0.0.1"
      CDP_PORT: "9222"
      CONTROLLER_PORT: "9223"
    volumes:
      # Persistent Chromium user profile (cookies, local storage, indexedDB, logins)
      - neko-profile:/home/neko/.config/chromium
      # Overridden Chromium supervisor definition with background streaming and loopback CDP
      - ./config/chromium.conf:/etc/neko/supervisord/chromium.conf:ro
      # Managed enterprise policies enabling CDP, URL blocks, and disabling destructive tab discarding
      - ./config/policies.json:/etc/chromium/policies/managed/policies.json:ro
      # Supervisor configuration for restricted tab controller
      - ./config/controller.conf:/etc/neko/supervisord/controller.conf:ro
      # Restricted Chromium tab controller script
      - ./controller/tab_controller.py:/etc/neko/tab_controller.py:ro
      # Startup wrapper for singleton lock cleanup, credential validation, and cookie preference initialization
      - ./scripts/entrypoint.sh:/entrypoint-maw.sh:ro

volumes:
  neko-profile:
    name: maw-neko-chromium-profile
