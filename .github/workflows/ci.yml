name: CI

on:
  push:
    # The work lands on develop; main only moves when a version is published.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  # publish.yml runs this whole workflow as its gate before uploading anything.
  workflow_call:

# Download fixture browsers explicitly in the Linux UI job. Electron has its
# own pinned Chromium runtime and a separately sandboxed lifecycle check.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # The app runs on Node 20, but working on the repository needs 22.13+:
        # pnpm requires it, and the checks use node:sqlite.
        node: ['22']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Agency Lane A focused domain tests
        working-directory: packages/server
        run: corepack pnpm exec tsx --test src/agency/domain.test.ts
      - name: Agency Lane B focused profile tests
        if: runner.os == 'Linux'
        working-directory: packages/server
        run: corepack pnpm exec tsx --test src/agents/profiles/profiles.test.ts
      - name: Agency Lane C focused runtime tests
        if: runner.os == 'Linux'
        working-directory: packages/server
        run: corepack pnpm exec tsx --test src/agency/runtime/agency-session-runtime.test.ts
      - name: Agency Lane D focused frontend model tests
        run: node --experimental-strip-types --test packages/web/src/agency/model.test.mjs
      # The checks were written on Windows, the primary platform: several
      # fixtures force `win32` while using real temp folders, so on Linux they
      # fail for reasons that aren't bugs in the app. Porting them is welcome.
      - run: pnpm check
        if: runner.os == 'Windows'
      - name: MAW security, native lifecycle, browser ownership and activity regressions
        if: runner.os == 'Linux'
        working-directory: packages/server
        run: pnpm exec tsx --test src/security.test.ts src/maw-host.test.ts src/output-backpressure.test.ts src/agency/*.test.ts src/agency/browser-tabs/*.test.ts src/agency/runtime/*.test.ts ../web/src/agency/split/interactive-cli-scroll.test.mjs
      - name: MAW updater, activation and rollback acceptance (mocked systemd)
        if: runner.os == 'Linux'
        working-directory: packages/server
        run: pnpm exec tsx --test src/maw-updater-acceptance.test.ts
      # Real-systemd activation/rollback (src/maw-systemd-acceptance.test.ts) needs a user systemd manager,
      # which hosted runners do not provide; it runs locally with MAW_REAL_SYSTEMD=1 and skips here.
      - name: Native desktop boundary policy
        if: runner.os == 'Linux'
        run: pnpm --filter @agent-workbench/desktop test
      - name: Browser for MAW UI regressions
        if: runner.os == 'Linux'
        run: pnpm exec playwright install chromium --with-deps
      - name: MAW real browser and notification UI regressions
        if: runner.os == 'Linux'
        run: node --test packages/web/src/agency/browser-tabs.test.mjs packages/web/src/agency/notifications.test.mjs packages/web/src/maw-root.test.mjs packages/web/src/terminal-webgl.test.mjs packages/web/src/agency/split/terminal-scrollback-20k.test.mjs
      - name: Ubuntu desktop package and production integration fixtures
        if: runner.os == 'Linux'
        run: |
          node scripts/maw/build-desktop-deb.mjs
          node --test packages/desktop/production.test.mjs
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ubuntu-desktop-runtime
          path: dist-desktop/*.deb
          if-no-files-found: error
      - name: Sandboxed native Electron lifecycle on a separate display
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends nautilus xdotool x11-utils adwaita-icon-theme dbus-x11
          maw_sandbox_helper="$(node -p "require('path').join(require('path').dirname(require.resolve('electron')), 'dist/chrome-sandbox')")"
          sudo install -o root -g root -m 4755 "$maw_sandbox_helper" "$maw_sandbox_helper.maw-ci"
          mv "$maw_sandbox_helper.maw-ci" "$maw_sandbox_helper"
          GSK_RENDERER=cairo LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a dbus-run-session env MAW_NAUTILUS_TEST_ISOLATED=1 pnpm test:electron
      - run: pnpm build

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:npm
      - name: Only the built files travel
        run: node .github/scripts/check-tarball.mjs
      - name: Pack what would be published
        run: npm pack --pack-destination "$GITHUB_WORKSPACE"
        working-directory: dist-npm
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: agent-workbench-*.tgz
          if-no-files-found: error

  # The package as a user gets it, on the three systems and on the oldest Node
  # it promises: it installs (node-pty is downloaded or compiled there), the
  # pseudo-terminal spawns a process, and the server starts and guards its door.
  smoke:
    name: Install and start · Node ${{ matrix.node }} on ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # No pnpm here on purpose: this job only has what a user has.
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      - name: Install the tarball and start the app
        shell: bash
        run: node .github/scripts/smoke.mjs agent-workbench-*.tgz

  # The Android app: its JVM tests and a debug APK (not signed for publishing).
  # It lives in android/, outside the pnpm workspace; nothing of it reaches the
  # npm package.
  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      # A pull request could swap the wrapper JAR for anything: check it's Gradle's.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK packages the build uses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" > /dev/null
      - name: Tests, lint and the debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
