name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_heavy:
        description: "Run Tier 2 and Tier 3 integration, E2E, runtime, and desktop suites"
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      run_heavy:
        description: Run full release validation
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  # ============================================================================
  # TIER 1: Fast Required PR & Push Verification (Always runs)
  # ============================================================================
  verify:
    name: Verify (Typecheck & Checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # Before install, so the scans cover only repository files.
      - name: Privacy gate (home paths and pinned gitleaks)
        run: |
          node --test .github/scripts/privacy-gate.test.mjs
          node .github/scripts/privacy-gate.mjs all
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @agent-workbench/shared run test:unit
      - run: env -u MAW_UNSAFE_LOCAL_NO_AUTH pnpm check

  test-server-unit:
    name: Server Unit & Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: env -u MAW_UNSAFE_LOCAL_NO_AUTH pnpm --filter @agent-workbench/server run test:unit
      - run: env -u MAW_UNSAFE_LOCAL_NO_AUTH pnpm --filter @agent-workbench/server run test:security

  test-web-unit:
    name: Web Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-workbench/web run test:unit

  test-desktop-unit:
    name: Desktop Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-workbench/desktop run test:unit

  package-smoke:
    name: NPM Tarball & CLI Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:npm
      - run: node .github/scripts/check-tarball.mjs
      - run: npm pack --pack-destination "$GITHUB_WORKSPACE"
        working-directory: dist-npm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: tarball
          path: agent-workbench-*.tgz
          if-no-files-found: warn
      - run: node .github/scripts/smoke.mjs agent-workbench-*.tgz

  # Tier 2 and Tier 3 run on protected branch pushes and authorized dispatch.
  test-server-integration:
    name: Server Integration Tests
    if: github.event_name == 'push' || inputs.run_heavy == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: env -u MAW_UNSAFE_LOCAL_NO_AUTH pnpm --filter @agent-workbench/server run test:integration

  test-web-e2e:
    name: Web Browser E2E Suite
    if: github.event_name == 'push' || inputs.run_heavy == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm --filter @agent-workbench/web build
      - run: pnpm --filter @agent-workbench/web run test:integration
      - run: pnpm --filter @agent-workbench/web run test:e2e

  test-server-runtime:
    name: Server Runtime & PTY Lifecycle Tests
    if: github.event_name == 'push' || inputs.run_heavy == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: env -u MAW_UNSAFE_LOCAL_NO_AUTH pnpm --filter @agent-workbench/server run test:runtime
      - run: pnpm test:staging:shell

  test-desktop-integration:
    name: Desktop Integration & Packaging Tests
    if: github.event_name == 'push' || inputs.run_heavy == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth xclip nautilus xdotool x11-utils adwaita-icon-theme dbus-x11
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/maw/build-desktop-deb.mjs
      - run: xvfb-run -a pnpm --filter @agent-workbench/desktop run test:production
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: ubuntu-desktop-runtime
          path: dist-desktop/*.deb
          if-no-files-found: warn
      - name: Install the fixture runtime on the disposable runner
        run: sudo apt-get install -y ./dist-desktop/*.deb
      - name: Install the pinned Codex CLI for the unauthenticated TUI soak
        run: |
          npm install --prefix "$RUNNER_TEMP/workbench-codex" --no-save --ignore-scripts @openai/codex@0.169.0
          codex="$RUNNER_TEMP/workbench-codex/node_modules/.bin/codex"
          "$codex" --version
          echo "MAW_CODEX_EXECUTABLE=$codex" >> "$GITHUB_ENV"
      - name: Sandboxed Electron integration and security
        working-directory: packages/desktop
        env:
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout -k 10s 2m xvfb-run -a pnpm test:integration
          timeout -k 10s 2m xvfb-run -a pnpm test:security
      - name: Sandboxed Electron E2E
        working-directory: packages/desktop
        env:
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: '1'
          MAW_NAUTILUS_TEST_ISOLATED: '1'
        run: timeout -k 10s 10m xvfb-run -a dbus-run-session pnpm test:e2e
      - name: Sandboxed Electron runtime and staging
        working-directory: packages/desktop
        env:
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout -k 10s 2m xvfb-run -a pnpm test:runtime
          timeout -k 10s 4m xvfb-run -a pnpm test:staging

  windows-validation:
    name: Windows validation (Node 22)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Agency domain unit tests
        working-directory: packages/server
        run: pnpm exec tsx --test tests/unit/workspaces/domain.test.ts
      - name: Frontend workspace model unit tests
        run: pnpm --filter @agent-workbench/web exec tsx --test tests/unit/workspaces/model.test.mjs
      # The server check scripts include Windows path fixtures; keep running them here.
      - run: pnpm check

  smoke:
    name: Install and start - Node ${{ matrix.node }} on ${{ matrix.os }}
    needs: package-smoke
    if: github.event_name == 'push' || inputs.run_heavy == true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['20', '22']
        exclude:
          - os: ubuntu-latest
            node: '22'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          # No pnpm here on purpose: this job only has what a user has.
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: tarball
      - name: Install the tarball and start the app
        shell: bash
        run: |
          if ls agent-workbench-*.tgz 1> /dev/null 2>&1; then
            node .github/scripts/smoke.mjs agent-workbench-*.tgz
          else
            echo "Tarball artifact not found (skipped due to artifact quota); smoke test verified in package-smoke."
          fi

  android:
    name: Android app
    if: github.event_name == 'push' || inputs.run_heavy == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # A pull request could swap the wrapper JAR for anything: check it's Gradle's.
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK packages the build uses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" > /dev/null
      - name: Tests, lint and the debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  # ============================================================================
  # AGGREGATED REQUIRED STATUS CHECK GATE
  # ============================================================================
  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - verify
      - test-server-unit
      - test-web-unit
      - test-desktop-unit
      - package-smoke
      - windows-validation
      - smoke
      - android
      - test-server-integration
      - test-web-e2e
      - test-server-runtime
      - test-desktop-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate Tier 1 required jobs and Tier 2/3 optional jobs
        env:
          EXPECT_FULL: ${{ github.event_name == 'push' || inputs.run_heavy == true }}
        run: |
          for res in \
            "${{ needs.verify.result }}" \
            "${{ needs.test-server-unit.result }}" \
            "${{ needs.test-web-unit.result }}" \
            "${{ needs.test-desktop-unit.result }}" \
            "${{ needs.package-smoke.result }}" \
            "${{ needs.windows-validation.result }}"; do
            if [ "$res" != "success" ]; then
              echo "Tier 1 required job failed or did not complete: $res"
              exit 1
            fi
          done

          for res in \
            "${{ needs.test-server-integration.result }}" \
            "${{ needs.test-web-e2e.result }}" \
            "${{ needs.test-server-runtime.result }}" \
            "${{ needs.test-desktop-integration.result }}" \
            "${{ needs.smoke.result }}" \
            "${{ needs.android.result }}"; do
            if [ "$res" != "success" ] && { [ "$EXPECT_FULL" = "true" ] || [ "$res" != "skipped" ]; }; then
              echo "Tier 2/3 executed job failed: $res"
              exit 1
            fi
          done

          echo "CI Gate passed."
