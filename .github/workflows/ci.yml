name: CI

on:
  push:
    # The work lands on develop; main only moves when a version is published.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  # publish.yml runs this whole workflow as its gate before uploading anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Download fixture browsers explicitly in the Linux E2E job. Electron has its
# own pinned Chromium runtime and a separately sandboxed lifecycle check.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  fast-checks:
    name: Fast checks (typecheck, unit, security, build) on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:security
      - run: pnpm --filter @agent-workbench/desktop test
      - run: pnpm build

  windows-validation:
    name: Windows validation (Node 22)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Agency domain unit tests
        working-directory: packages/server
        run: corepack pnpm exec tsx --test tests/unit/workspaces/domain.test.ts
      - name: Frontend workspace model unit tests
        run: node --experimental-strip-types --test packages/web/tests/unit/workspaces/model.test.mjs
      # The server check scripts include Windows path fixtures; keep running them here.
      - run: pnpm check

  server-runtime-and-integration:
    name: Server integration and runtime suites (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Server integration tests
        run: pnpm --filter @agent-workbench/server run test:integration
      # Real-systemd acceptance skips when MAW_REAL_SYSTEMD is unset (no user systemd in hosted runners).
      - name: Server runtime, PTY supervisor, recovery, and updater tests
        run: pnpm --filter @agent-workbench/server run test:runtime

  desktop-and-browser-e2e:
    name: Browser E2E and Electron lifecycle (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium for web E2E regressions
        run: pnpm exec playwright install chromium --with-deps
      - name: Web integration tests
        run: pnpm --filter @agent-workbench/web run test:integration
      - name: Web browser E2E regressions
        run: |
          pnpm --filter @agent-workbench/web test
          pnpm --filter @agent-workbench/web exec tsx --test tests/e2e/browser/browser-favorites-acceptance.test.mjs tests/e2e/terminals/terminal-scrollback-20k.test.mjs tests/e2e/terminals/terminal-webgl.test.mjs tests/e2e/panes/split-divider-lifecycle.test.mjs tests/e2e/panes/tab-close-lifecycle.test.mjs tests/e2e/panes/tab-scroll-ergonomics.test.mjs
      - name: Ubuntu desktop package and production integration fixtures
        run: |
          node scripts/maw/build-desktop-deb.mjs
          node --test packages/desktop/tests/integration/desktop/production.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-desktop-runtime
          path: dist-desktop/*.deb
          if-no-files-found: error
      - name: Sandboxed native Electron lifecycle on a separate display
        working-directory: packages/desktop
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends nautilus xdotool x11-utils adwaita-icon-theme dbus-x11
          maw_sandbox_helper="$(node -p "require('path').join(require('path').dirname(require.resolve('electron')), 'dist/chrome-sandbox')")"
          sudo install -o root -g root -m 4755 "$maw_sandbox_helper" "$maw_sandbox_helper.maw-ci"
          mv "$maw_sandbox_helper.maw-ci" "$maw_sandbox_helper"
          GSK_RENDERER=cairo LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a dbus-run-session env MAW_NAUTILUS_TEST_ISOLATED=1 pnpm test:electron
      - run: pnpm build
      - name: Built MAW desktop and backend recovery
        working-directory: packages/desktop
        run: xvfb-run -a pnpm test:staging

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:npm
      - name: Only the built files travel
        run: node .github/scripts/check-tarball.mjs
      - name: Pack what would be published
        run: npm pack --pack-destination "$GITHUB_WORKSPACE"
        working-directory: dist-npm
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: agent-workbench-*.tgz
          if-no-files-found: error

  # The package as a user gets it, on the three systems and on the oldest Node
  # it promises: it installs (node-pty is downloaded or compiled there), the
  # pseudo-terminal spawns a process, and the server starts and guards its door.
  smoke:
    name: Install and start - Node ${{ matrix.node }} on ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # No pnpm here on purpose: this job only has what a user has.
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      - name: Install the tarball and start the app
        shell: bash
        run: node .github/scripts/smoke.mjs agent-workbench-*.tgz

  # The Android app: its JVM tests and a debug APK (not signed for publishing).
  # It lives in android/, outside the pnpm workspace; nothing of it reaches the
  # npm package.
  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      # A pull request could swap the wrapper JAR for anything: check it's Gradle's.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK packages the build uses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" > /dev/null
      - name: Tests, lint and the debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
