<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Security Key PIN</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a1c;
      color: #e2e8f0;
      user-select: none;
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 15px;
      font-weight: 600;
      color: #f8fafc;
    }
    p {
      margin: 0 0 16px 0;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .input-group {
      margin-bottom: 20px;
    }
    input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #334155;
      border-radius: 6px;
      background-color: #0f172a;
      color: #f8fafc;
      outline: none;
    }
    input[type="password"]:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px #38bdf8;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    button {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .btn-secondary {
      background-color: transparent;
      border-color: #334155;
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background-color: #334155;
    }
    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>
  <h2>Security Key PIN Required</h2>
  <p id="description">Enter the PIN for your hardware security key to complete authentication.</p>
  <form id="pin-form">
    <div class="input-group">
      <input type="password" id="pin-input" autofocus autocomplete="off" placeholder="Security key PIN" />
    </div>
    <div class="actions">
      <button type="button" id="btn-cancel" class="btn-secondary">Cancel</button>
      <button type="submit" id="btn-submit" class="btn-primary">Continue</button>
    </div>
  </form>

  <script>
    const form = document.getElementById('pin-form');
    const pinInput = document.getElementById('pin-input');
    const btnCancel = document.getElementById('btn-cancel');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const pin = pinInput.value;
      if (pin.length > 0 && window.webauthnPin) {
        window.webauthnPin.submit(pin);
      }
    });

    btnCancel.addEventListener('click', () => {
      if (window.webauthnPin) {
        window.webauthnPin.cancel();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && window.webauthnPin) {
        window.webauthnPin.cancel();
      }
    });
  </script>
</body>
</html>
