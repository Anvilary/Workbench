<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Security Key PIN</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #141417;
      color: #f4f4f5;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    .dialog-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .key-icon {
      width: 20px;
      height: 20px;
      color: #f97316;
      flex-shrink: 0;
    }
    h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: #f4f4f5;
      letter-spacing: -0.01em;
    }
    p {
      margin: 0 0 16px 0;
      font-size: 13px;
      color: #a1a1aa;
      line-height: 1.45;
    }
    .rp-id {
      color: #e4e4e7;
      font-weight: 500;
    }
    .input-group {
      margin-bottom: 12px;
    }
    input[type="password"] {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      letter-spacing: 2px;
      border: 1px solid #2e2e36;
      border-radius: 6px;
      background-color: #1e1e24;
      color: #f4f4f5;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input[type="password"]:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 1px #f97316;
    }
    .error-msg {
      margin: 0 0 14px 0;
      font-size: 12px;
      color: #ef4444;
      line-height: 1.4;
      min-height: 16px;
      display: none;
    }
    .error-msg.visible {
      display: block;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 4px;
    }
    button {
      height: 36px;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn-secondary {
      background-color: transparent;
      border-color: #2e2e36;
      color: #d4d4d8;
    }
    .btn-secondary:hover {
      background-color: #222227;
      border-color: #3f3f46;
    }
    .btn-primary {
      background-color: #f97316;
      border-color: #ea580c;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #ea580c;
    }
    .btn-primary:active {
      background-color: #c2410c;
    }
  </style>
</head>
<body>
  <div class="dialog-header">
    <svg class="key-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="7.5" cy="15.5" r="5.5"/>
      <path d="m21 2-9.6 9.6"/>
      <path d="m15.5 7.5 3 3L22 7l-3-3"/>
    </svg>
    <h2>Security Key PIN Required</h2>
  </div>
  <p id="description">Enter your security-key PIN to authenticate with <span id="rp-name" class="rp-id">the service</span>.</p>
  <div id="error-msg" class="error-msg"></div>
  <form id="pin-form">
    <div class="input-group">
      <input type="password" id="pin-input" autofocus autocomplete="off" placeholder="Enter PIN" />
    </div>
    <div class="actions">
      <button type="button" id="btn-cancel" class="btn-secondary">Cancel</button>
      <button type="submit" id="btn-submit" class="btn-primary">Continue</button>
    </div>
  </form>

  <script>
    const form = document.getElementById('pin-form');
    const pinInput = document.getElementById('pin-input');
    const btnCancel = document.getElementById('btn-cancel');
    const rpName = document.getElementById('rp-name');
    const errorMsg = document.getElementById('error-msg');

    const params = new URLSearchParams(window.location.search);
    const requestId = params.get('requestId') || '';
    const rpId = params.get('rpId');
    if (rpId) {
      rpName.textContent = rpId;
    }
    const error = params.get('error');
    if (error) {
      errorMsg.textContent = error;
      errorMsg.classList.add('visible');
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const pin = pinInput.value;
      if (pin.length > 0 && window.webauthnPin) {
        window.webauthnPin.submit({ requestId, pin });
      }
    });

    btnCancel.addEventListener('click', () => {
      if (window.webauthnPin) {
        window.webauthnPin.cancel({ requestId });
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && window.webauthnPin) {
        window.webauthnPin.cancel({ requestId });
      }
    });
  </script>
</body>
</html>
